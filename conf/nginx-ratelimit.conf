# =============================================================================
# nginx-ratelimit.conf - rate limit + chong slowloris
#
# Cach dung:
#   - Phan "http context" dan vao /etc/nginx/nginx.conf trong block http {}
#     hoac dat file nay trong /etc/nginx/conf.d/ (conf.d duoc include trong http).
#   - Phan "server context" dan vao server {} cua site can bao ve.
#
#   nginx -t && systemctl reload nginx
#
# Luu y:
#   - Neu site di qua CDN (Cloudflare...), $binary_remote_addr la IP cua CDN.
#     Phai cau hinh real_ip truoc, neu khong rate limit se ap cho toan bo
#     nguoi dung va site coi nhu bi chan.
#   - 429 la ma dung cho rate limit (khong phai 503).
# =============================================================================


# -----------------------------------------------------------------------------
# HTTP CONTEXT
# -----------------------------------------------------------------------------

# 10 request/giay/IP cho toan site, burst 20.
limit_req_zone $binary_remote_addr zone=req_per_ip:20m rate=10r/s;

# 1 request/giay/IP cho trang login - rat chat.
limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=1r/s;

# 10 request/giay/IP cho API (tuy chinh theo tai that).
limit_req_zone $binary_remote_addr zone=api_per_ip:20m rate=10r/s;

# Gioi han so ket noi dong thoi moi IP.
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;


# -----------------------------------------------------------------------------
# SERVER CONTEXT
# -----------------------------------------------------------------------------

# Chong slowloris / slow POST: khong giu ket nua voi client khong gui du lieu.
client_header_timeout 10s;
client_body_timeout   10s;
send_timeout          15s;
keepalive_timeout     20s;
keepalive_requests    100;
reset_timedout_connection on;

# Gioi han body - chong POST flood (dieu chinh theo ung dung).
client_max_body_size 10m;

# Moi IP toi da 30 ket noi dong thoi (tang neu site nhieu anh/JS).
limit_conn conn_per_ip 30;

location / {
    limit_req zone=req_per_ip burst=20 nodelay;
    try_files $uri $uri/ /index.php?$args;
}

# Login: chi 1 r/s, burst 5.
location = /wp-login.php {
    limit_req zone=login_per_ip burst=5 nodelay;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php-fpm.sock;
}

# XML-RPC khong dung thi chan han (rat hay bi brute-force / pingback flood).
location = /xmlrpc.php {
    deny all;
    access_log off;
}

# API: rate rieng.
location /api/ {
    limit_req zone=api_per_ip burst=10 nodelay;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php-fpm.sock;
}

# =============================================================================
# Theo doi hieu qua:
#   grep 'limiting requests' /var/log/nginx/error.log | tail
#   awk '$9 == 429' /var/log/nginx/access.log | wc -l
#
# Neu 429 tang manh tren nguoi dung that -> tang rate/burst hoac chi ap dung
# rate limit cho path dong (.php, /api, /login) thay vi toan site.
# =============================================================================
