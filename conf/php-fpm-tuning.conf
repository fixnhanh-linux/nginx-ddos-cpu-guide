; ============================================================================
; php-fpm-tuning.conf - tham khao cau hinh pool PHP-FPM
;
; KHONG copy nguyen xi. Hay tinh max_children theo RAM that:
;
;   ps -o rss= -C php-fpm | awk '{s+=$1; n++} END{printf "avg %.1f MB\n", s/n/1024}'
;   max_children = (RAM danh cho PHP) / (RSS trung binh 1 worker)
;
; Vi du: 4 GB may, -512 MB OS, -512 MB DB/nginx => 3 GB
;        worker 60 MB => 3072/60 = 51 => dat 40-45 de co headroom.
;
; Dan vao: /etc/php/8.2/fpm/pool.d/www.conf (hoac pool rieng tung site)
; ============================================================================

[www]
user  = www-data
group = www-data

; --- process manager -------------------------------------------------------
; dynamic: tiet kiem RAM, phu hop web thuong
; static : on dinh, do tre thap, phu hop traffic lon va RAM du
pm = dynamic

pm.max_children      = 45
pm.start_servers     = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 15

; Worker tu restart sau N request: giai phong memory leak cua plugin.
; Qua thap (<100) lam tang CPU do khoi tao lai lien tuc.
pm.max_requests = 500

; --- thoi gian -------------------------------------------------------------
; Request chay qua lau => cat. Phai lon hon thoi gian xu ly hop le dai nhat.
request_terminate_timeout = 60s

; Request chay qua 5s => ghi vao slowlog (cong cu manh nhat de tim code cham).
request_slowlog_timeout = 5s
slowlog = /var/log/php-fpm/slow.log

; --- status page (chi nghe noi bo) ----------------------------------------
pm.status_path = /fpm-status
ping.path      = /fpm-ping

; --- tu phuc hoi -----------------------------------------------------------
; Neu qua N worker chet trong khoang thoi gian => FPM tu restart master.
emergency_restart_threshold = 10
emergency_restart_interval  = 1m
process_control_timeout     = 10s

; --- gioi han tai nguyen ---------------------------------------------------
; Gioi han file descriptor cho moi worker (tranh "Too many open files").
rlimit_files = 65535

; Gioi hien core dump (tranh file core vai GB lam day disk).
rlimit_core = 0

; --- listen ----------------------------------------------------------------
; Unix socket nhanh hon TCP loopback mot chut.
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; Backlog: so ket noi cho duoc xep hang khi pool day.
; Neu listen queue lon trong status => tang so nay + so worker.
listen.backlog = 511

; ============================================================================
; Sau khi doi: systemctl restart php8.2-fpm
;
; Kiem tra:
;   curl -s http://127.0.0.1/fpm-status
;   tail -f /var/log/php-fpm/slow.log
;
; Doc status:
;   max children reached > 0  -> thieu worker HOAC code giu worker qua lau
;   listen queue > 0          -> request phai xep hang
;   slow requests > 0         -> xem slowlog
; ============================================================================
