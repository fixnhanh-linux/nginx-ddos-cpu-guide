# =============================================================================
# Kiem tra:
#   curl -sI https://example.com/ | grep -i x-cache-status
#   HIT  = phuc vu tu cache
#   MISS = vao PHP
#
# Theo doi ti le:
#   awk '{print $NF}' access.log | sort | uniq -c | sort -rn | head
# =============================================================================
