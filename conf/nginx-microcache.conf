# =============================================================================
# nginx-microcache.conf - cache 10 giay de giam tai PHP khi bi flood
#
# Tac dung: request lap lai trong 10 giay duoc tra tu cache, khong vao PHP.
# Trong luc DDoS L7, cach nay thuong giam 80-99% tai len PHP.
#
# Cach dung:
#   1. Dan phan "http context" vao /etc/nginx/nginx.conf (block http {})
#   2. Dan phan "server context" vao server {} cua site
#   3. nginx -t && systemctl reload nginx
#
# Luu y:
#   - Khong cache khi co cookie dang nhap, POST, hoac query string dong.
#   - Cache 10s la du de giam flood ma nguoi dung gan nhu khong nhan ra.
#   - Khong ap dung cho trang admin / gio hang / thanh toan.
# =============================================================================


# -----------------------------------------------------------------------------
# HTTP CONTEXT
# -----------------------------------------------------------------------------

proxy_cache_path /var/cache/nginx/micro
                 levels=1:2
                 keys_zone=micro:20m
                 inactive=60s
                 max_size=2g
                 use_temp_path=off;

# Neu dung fastcgi (PHP-FPM) thay vi proxy, dung khoi nay thay the:
# fastcgi_cache_path /var/cache/nginx/fcgi
#                    levels=1:2
#                    keys_zone=fcgi:20m
#                    inactive=60s
#                    max_size=2g
#                    use_temp_path=off;


# -----------------------------------------------------------------------------
# SERVER CONTEXT
# -----------------------------------------------------------------------------

# 0 = cache binh thuong, 1 = bo qua cache (khong doc/khong ghi).
set $skip_cache 0;

if ($request_method = POST) {
    set $skip_cache 1;
}

if ($http_cookie ~* "(wordpress_logged_in|wp-postpass|comment_author|woocommerce_items_in_cart|PHPSESSID|laravel_session)") {
    set $skip_cache 1;
}

# Khong cache admin, gio hang, thanh toan.
if ($request_uri ~* "/(wp-admin|wp-login\.php|cart|checkout|my-account)") {
    set $skip_cache 1;
}

# Khong cache khi co query string (tranh cache-bypass va ro ri du lieu).
if ($query_string != "") {
    set $skip_cache 1;
}

location / {
    proxy_cache            micro;
    proxy_cache_key        "$scheme$request_method$host$request_uri";
    proxy_cache_valid      200 301 302 10s;
    proxy_cache_valid      404 1s;
    proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock       on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_background_update on;
    proxy_cache_bypass     $skip_cache;
    proxy_no_cache         $skip_cache;

    add_header X-Cache-Status $upstream_cache_status always;

    proxy_pass http://127.0.0.1:8080;
}

